<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>akan-name-generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="body">
    <header>
      <nav class="navigation">
        <!-- logo -->
        <div class="logo">
          <img class="logo" src="akanlogo.jpg" alt="logo" />
        </div>
        <!-- heading -->
        <div>
          <h1>DO YOU KNOW YOUR AKAN NAME ?</h1>
          <h3>A GHANAIAN CULTURE</h3>
        </div>
      </nav>
    </header>
    <main>
      <!-- introduction -->
      <section class="intro">
        <h3>what are Akan Names</h3>
        <p>
          Akan names are a part of ghanian culture that give you a name
          according to your date of birth and gender
        </p>
      </section>
      <!-- input form -->
      <section class="form">
        <p>To get your Akan name fill in the details below</p>

        <form>
          <!-- date born -->
          <label for=" birth-date">Date of Birth:</label><br />
          <input type="number" id="birth-date" name="birth-date" /><br /><br />
          <!-- month born -->
          <label for="month">Month of Birth:</label><br />
          <input type="text" id="month" name="month" /><br /><br />
          <!-- year born -->
          <label for="year">Year of Birth:</label><br />
          <input type="number" id="year" name="year" /><br /><br />
          <!-- gender -->
          <label for="gender">Gender:</label><br />
          <input type="text" id="gender" name="gender" /><br /><br />
          <!-- submit button -->
          <button type="submit">Send</button>
        </form>
      </section>
    </main>
    <script> src = "script.js"</script>
  </body>
  <footer class="footer">
    <p>© 2026 all rights reserved</p>
  </footer>
</html>
